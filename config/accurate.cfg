
# Hybrid FEM Heat Solver - Realtime configuration

mode = accurate

# Arduino
port = COM7
baud_rate = 9600
max_steps = 50

# Mesh
radial_elements = 20
axial_elements = 40

# Geometry [m]
radius = 0.02
height = 0.05

# Material and initial condition
density = 1700.0
initial_temperature = 20.0

# Picard iteration
picard_tolerance = 0.0001
max_picard_iterations = 50

# Maximum internal FEM time step [s]
accurate_time_step = 0.1

# Input files
material_file = data/materials/magnesium_alloy.csv
htc_file = data/boundary/htc_effective.csv
measurement_file = results/session_001/acquisition.csv